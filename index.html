<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平均價格計算器</title>
  
  <style>
    :root{
      --bg:#f3f5f9;
      --card:#ffffff;
      --text:#111827;
      --muted:#8b95a7;
      --line:#e7eaf0;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --dark:#111827;
      --danger:#ef4444;
      --danger-bg:#fff0f0;
      --soft:#f8fafc;
      --radius:22px;
      --shadow:0 12px 34px rgba(15,23,42,.07);
    }

    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .hidden{display:none!important}

    /* Login */
    .login-screen{
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 20px;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.16), transparent 38%),
        linear-gradient(160deg,#0f172a 0%,#111827 60%,#1e293b 100%);
    }

    .login-card{
      width:100%;
      max-width:410px;
      background:rgba(255,255,255,.98);
      border-radius:28px;
      padding:30px 24px 24px;
      box-shadow:0 26px 70px rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.7);
    }

    .login-icon{
      width:68px;
      height:68px;
      margin:0 auto 18px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(145deg,#2563eb,#1d4ed8);
      color:white;
      font-size:30px;
      box-shadow:0 12px 26px rgba(37,99,235,.28);
    }

    .login-title{
      text-align:center;
      font-size:26px;
      font-weight:800;
      letter-spacing:-.4px;
    }

    .login-sub{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      margin:8px 0 24px;
    }

    .group{margin-bottom:15px}

    label{
      display:block;
      margin:0 0 8px;
      color:#667085;
      font-size:13px;
      font-weight:650;
    }

    input{
      width:100%;
      height:54px;
      padding:0 15px;
      border:1.5px solid #dce1e8;
      border-radius:16px;
      outline:none;
      color:var(--text);
      background:#fff;
      font-size:17px;
      transition:.18s ease;
    }

    input:focus{
      border-color:#7aa2ff;
      box-shadow:0 0 0 4px rgba(37,99,235,.09);
    }

    input::placeholder{color:#b0b7c3}

    .password-wrap{position:relative}
    .password-wrap input{padding-right:66px}

    .toggle-pass{
      position:absolute;
      right:7px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:#f1f5f9;
      color:#526071;
      border-radius:12px;
      padding:9px 10px;
      font-size:13px;
      font-weight:700;
    }

    .login-btn{
      width:100%;
      min-height:54px;
      border:0;
      border-radius:16px;
      background:linear-gradient(135deg,var(--primary),#3b82f6);
      color:white;
      font-weight:800;
      font-size:17px;
      box-shadow:0 10px 24px rgba(37,99,235,.22);
      cursor:pointer;
    }

    .login-btn:active{transform:scale(.99)}
    .login-note{
      text-align:center;
      color:#9aa3b2;
      font-size:12px;
      line-height:1.55;
      margin-top:14px;
    }
    .login-error{
      color:#dc2626;
      font-size:13px;
      min-height:18px;
      margin-top:7px;
    }

    /* App */
    .screen{
      min-height:100svh;
      padding:18px 14px 34px;
    }

    .container{
      width:100%;
      max-width:680px;
      margin:0 auto;
    }

    h1{
      margin:5px 0 18px;
      text-align:center;
      font-size:28px;
      font-weight:850;
      letter-spacing:-.7px;
    }

    .card,
    .result-card{
      border-radius:var(--radius);
      margin-bottom:16px;
    }

    .card{
      background:var(--card);
      padding:20px;
      box-shadow:var(--shadow);
      border:1px solid rgba(17,24,39,.035);
    }

    .result-card{
      padding:24px 20px;
      color:white;
      background:
        radial-gradient(circle at 90% 0%, rgba(59,130,246,.38), transparent 38%),
        linear-gradient(145deg,#111827,#0f172a);
      box-shadow:0 18px 34px rgba(15,23,42,.16);
    }

    .result-title{
      color:#aeb8c7;
      font-size:13px;
      font-weight:650;
      letter-spacing:.2px;
    }

    .average{
      margin:8px 0 20px;
      font-size:46px;
      line-height:1.05;
      font-weight:850;
      letter-spacing:-1.2px;
    }

    .summary{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .summary-box{
      padding:13px 14px;
      border-radius:15px;
      text-align:left;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.06);
    }

    .small{
      color:#aeb8c7;
      font-size:12px;
      margin-bottom:4px;
    }

    .value{
      font-size:18px;
      font-weight:750;
    }

    .difference{
      margin-top:12px;
      padding:11px 13px;
      border-radius:14px;
      background:rgba(255,255,255,.1);
      color:#e5e7eb;
      font-size:13px;
      line-height:1.5;
    }

    .title{
      margin:0 0 16px;
      font-size:19px;
      font-weight:800;
      letter-spacing:-.2px;
    }

    .active-code{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 12px;
      border-radius:999px;
      background:#eef4ff;
      color:#1d4ed8;
      font-size:13px;
      font-weight:750;
    }

    .status{
      margin:10px 0 0;
      color:#7b8494;
      font-size:13px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .buy-row{
      display:grid;
      grid-template-columns:1fr 1fr 48px;
      gap:9px;
      margin-bottom:10px;
    }

    button{
      border:0;
      border-radius:15px;
      cursor:pointer;
      transition:transform .08s ease,opacity .12s ease;
    }

    button:active{
      transform:scale(.985);
      opacity:.9;
    }

    .primary,
    .save,
    .secondary,
    .logout{
      width:100%;
      min-height:52px;
      font-weight:780;
      font-size:16px;
    }

    .primary{
      background:#111827;
      color:white;
    }

    .save{
      margin-top:10px;
      background:linear-gradient(135deg,var(--primary),#3b82f6);
      color:white;
      box-shadow:0 8px 18px rgba(37,99,235,.14);
    }

    .secondary{
      margin-top:10px;
      background:#eef1f5;
      color:#465366;
    }

    .logout{
      margin-top:10px;
      background:var(--danger-bg);
      color:#dc2626;
    }

    .delete{
      min-height:54px;
      padding:0;
      background:#fee2e2;
      color:#dc2626;
      font-size:24px;
      font-weight:500;
    }

    /* History */
    .history-item{
      margin-bottom:12px;
      padding:16px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      box-shadow:0 5px 16px rgba(15,23,42,.025);
    }

    .history-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .history-name{
      font-size:20px;
      font-weight:850;
      letter-spacing:.1px;
    }

    .history-time{
      flex-shrink:0;
      color:#9aa3b2;
      font-size:12px;
      line-height:1.4;
      text-align:right;
    }

    .history-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:13px;
    }

    .stat{
      padding:12px;
      border-radius:14px;
      background:#f7f8fa;
    }

    .stat-label{
      color:#98a2b3;
      font-size:12px;
      margin-bottom:5px;
    }

    .stat-value{
      font-size:16px;
      font-weight:800;
      word-break:break-word;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:12px;
    }

    .actions button{
      min-height:45px;
      font-size:15px;
      font-weight:750;
    }

    .load{
      background:#e7f0ff;
      color:#2563eb;
    }

    .remove{
      background:#fff0f0;
      color:#dc2626;
    }

    .empty{
      padding:24px 8px;
      text-align:center;
      color:#9aa3b2;
      font-size:14px;
    }

    @media(max-width:520px){
      .screen{padding:14px 12px 28px}
      .card{padding:18px}
      h1{font-size:25px}
      .average{font-size:42px}
      .grid{gap:9px}
      .history-grid{grid-template-columns:1fr 1fr}
    }

    @media(max-width:370px){
      .grid{grid-template-columns:1fr}
      .buy-row{grid-template-columns:1fr 1fr 44px}
      .history-grid{grid-template-columns:1fr}
    }
  </style>

</head>
<body>


<div id="loginScreen" class="login-screen">
  <div class="login-wrap">
    <div class="login-brand">AVERAGE PRICE</div>
    <h1 class="login-hero-title">平均價格計算器</h1>
    <div class="login-hero-sub">輸入密碼後，快速查看與同步你的平均價格紀錄</div>

    <div class="login-card">
      <div class="login-card-top">
        <div class="login-card-title">登入</div>
        <div class="login-card-hint">3 碼以上即可進入</div>
      </div>

      <div class="group">
        <label>密碼</label>
        <div class="password-wrap">
          <input id="passwordInput" type="password" placeholder="輸入密碼" minlength="3" autocomplete="current-password">
          <button type="button" class="toggle-pass" onclick="togglePassword()">顯示</button>
        </div>
        <div id="loginError" class="login-error"></div>
      </div>

      <button class="login-btn" onclick="enterApp()">進入計算器</button>

      <div class="login-meta">
        <div class="login-chip">多裝置同步</div>
        <div class="login-chip">雲端紀錄</div>
        <div class="login-chip">快速計算</div>
      </div>

      <div class="login-note">同一組密碼可在不同裝置讀取相同紀錄。</div>
    </div>
  </div>
</div>


<div id="appScreen" class="screen hidden">
  <div class="container">
    <h1>平均價格計算器</h1>

    <div class="card">
      <div class="title">目前同步帳號</div>
      <div class="active-code" id="activeCode">—</div>
      <div class="status" id="syncStatus">尚未同步</div>
<div id="syncMessage" class="sync-message"></div>
      <button class="secondary" onclick="syncNow()">立即同步</button>
      <button class="logout" onclick="logout()">登出 / 更換密碼</button>
    </div>

    <div class="result-card">
      <div class="result-title">買入後平均價格</div>
      <div class="average" id="average">0.00</div>
      <div class="summary">
        <div class="summary-box"><div class="small">總數量</div><div class="value" id="totalQty">0.00</div></div>
      </div>
      <div class="difference" id="difference">輸入資料後自動計算</div>
    </div>

    <div class="card">
      <div class="title">計算資料</div>
      <div class="group"><label>名稱</label><input id="calcName" placeholder="例如 BTC、ETH、SOXL" inputmode="latin" autocapitalize="characters" autocomplete="off" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z]/g, '')"></div>
      <div class="grid">
        <div class="group"><label>目前平均價格</label><input id="currentPrice" type="number" step="any" oninput="calculate()"></div>
        <div class="group"><label>目前持有數量</label><input id="currentQty" type="number" step="any" oninput="calculate()"></div>
      </div>
      <div class="title" style="font-size:14px">新增買入</div>
      <div id="rows"></div>
      <button class="primary" onclick="addRow()">＋ 新增一筆買入</button>
      <button class="save" onclick="saveToCloud()">儲存到雲端</button>
      <button class="secondary" onclick="clearInputs()">清除目前輸入</button>
    </div>

    <div class="card">
      <div class="title">紀錄</div>
      <div id="historyList"><div class="empty">登入後會自動同步</div></div>
    </div>
  </div>
</div>

<iframe name="hiddenFrame" style="display:none"></iframe>
<form id="hiddenForm" action="https://script.google.com/macros/s/AKfycbxRr2tWrw3Y1QxquWXqwDHac6itRuu79o2B5LDCmA5JS7V225CV_Fiaj4kOxiAuj9jj/exec" method="POST" target="hiddenFrame" style="display:none">
  <input type="hidden" name="payload" id="payloadField">
</form>


<div id="confirmModal" class="modal-overlay hidden" onclick="closeDeleteModal(event)">
  <div class="modal-box">
    <div class="modal-title">刪除紀錄</div>
    <div class="modal-text">這筆紀錄刪除後就無法復原，確定要刪除嗎？</div>
    <div class="modal-actions">
      <button class="modal-btn modal-cancel" type="button" onclick="closeDeleteModal()">取消</button>
      <button class="modal-btn modal-confirm" type="button" onclick="confirmDelete()">確定刪除</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxRr2tWrw3Y1QxquWXqwDHac6itRuu79o2B5LDCmA5JS7V225CV_Fiaj4kOxiAuj9jj/exec";
const rows = document.getElementById("rows");
let currentSyncCode = "";
let pendingDeleteId = null;

function togglePassword(){
  const input = document.getElementById("passwordInput");
  const btn = document.querySelector(".toggle-pass");
  if(input.type === "password"){
    input.type = "text";
    btn.textContent = "隱藏";
  } else {
    input.type = "password";
    btn.textContent = "顯示";
  }
}

function enterApp(){
  const code = document.getElementById("passwordInput").value.trim();
  const error = document.getElementById("loginError");

  if(code.length < 3){
    error.textContent = "密碼至少輸入 3 個字元";
    return;
  }

  error.textContent = "";
  currentSyncCode = code;
  sessionStorage.setItem("avg_session_code", code);

  document.getElementById("activeCode").textContent = "已連線";
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");

  loadHistory();
}

function logout(){
  closeDeleteModal();
  sessionStorage.removeItem("avg_session_code");
  currentSyncCode = "";
  document.getElementById("passwordInput").value = "";
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("historyList").innerHTML = '<div class="empty">登入後會自動同步</div>';
}

function addRow(price="", qty=""){
  const row=document.createElement("div");
  row.className="buy-row";
  row.innerHTML=`<input type="number" class="price" step="any" placeholder="買入價格" value="${price}" oninput="calculate()">
  <input type="number" class="qty" step="any" placeholder="數量" value="${qty}" oninput="calculate()">
  <button class="delete" onclick="removeRow(this)">×</button>`;
  rows.appendChild(row);
}

function removeRow(btn){btn.parentElement.remove();if(!rows.children.length)addRow();calculate();}

function getData(){
  const currentPrice=parseFloat(document.getElementById("currentPrice").value)||0;
  const currentQty=parseFloat(document.getElementById("currentQty").value)||0;
  let totalQty=currentQty,totalCost=currentPrice*currentQty;
  const buys=[];
  document.querySelectorAll(".buy-row").forEach(row=>{
    const p=parseFloat(row.querySelector(".price").value),q=parseFloat(row.querySelector(".qty").value);
    if(!isNaN(p)&&!isNaN(q)&&q>0){buys.push({price:p,qty:q});totalQty+=q;totalCost+=p*q;}
  });
  return {currentPrice,currentQty,buys,totalQty,totalCost,average:totalQty>0?totalCost/totalQty:0};
}

function fmt(n,d=4){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:d});}

function calculate(){
  const d=getData();
  document.getElementById("average").textContent=fmt(d.average,4);
  document.getElementById("totalQty").textContent=fmt(d.totalQty,8);
  const difference=document.getElementById("difference");
  if(d.currentPrice>0&&d.currentQty>0){
    const diff=d.average-d.currentPrice,pct=diff/d.currentPrice*100;
    difference.textContent=diff<0?`平均價降低 ${fmt(Math.abs(diff),4)}（${Math.abs(pct).toFixed(2)}%）`:diff>0?`平均價提高 ${fmt(diff,4)}（${pct.toFixed(2)}%）`:"平均價格沒有變化";
  }else difference.textContent="輸入目前持有資料後自動計算";
}

function getSyncCode(){return currentSyncCode;}
function setStatus(t){document.getElementById("syncStatus").textContent=t;}


function showSyncMessage(message, type="info", withRetry=false){
  const box = document.getElementById("syncMessage");
  if(!box) return;
  box.className = `sync-message show ${type}`;
  box.innerHTML = `${escapeHtml(message)}${withRetry ? '<br><button class="retry-btn" onclick="syncNow()">重新同步</button>' : ''}`;
}

function clearSyncMessage(){
  const box = document.getElementById("syncMessage");
  if(!box) return;
  box.className = "sync-message";
  box.innerHTML = "";
}

function saveToCloud(){
  const syncCode=getSyncCode(),name=document.getElementById("calcName").value.trim().toUpperCase(),d=getData();
  if(!syncCode){ showSyncMessage("請先輸入密碼登入","error"); return; }
  if(!name){ showSyncMessage("請輸入名稱","error"); return; }
  if(d.totalQty<=0){ showSyncMessage("請輸入價格與數量","error"); return; }

  document.getElementById("payloadField").value=JSON.stringify({action:"save",syncCode,name,...d});
  setStatus("正在儲存…"); clearSyncMessage(); showSyncMessage("正在儲存到雲端…","info");
  document.getElementById("hiddenForm").submit();

  setTimeout(()=>{
    setStatus("已送出，正在更新紀錄…"); showSyncMessage("資料已送出，正在更新紀錄…","info");
    loadHistory();
  },1200);
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const s=document.createElement("script");
    let done=false;
    window[cb]=(data)=>{done=true;resolve(data);cleanup();};
    function cleanup(){delete window[cb];s.remove();}
    s.onerror=()=>{if(!done)reject(new Error("無法連線到雲端"));cleanup();};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+encodeURIComponent(cb);
    document.body.appendChild(s);
    setTimeout(()=>{if(!done){reject(new Error("同步逾時"));cleanup();}},10000);
  });
}

async function syncNow(){
  if(!getSyncCode()){ showSyncMessage("請先輸入密碼登入","error"); return; }
  await loadHistory();
}

async function loadHistory(){
  const syncCode=getSyncCode();
  if(!syncCode)return;
  setStatus("正在同步…"); clearSyncMessage(); showSyncMessage("正在同步資料…","info");
  try{
    const data=await jsonp(`${API_URL}?action=list&syncCode=${encodeURIComponent(syncCode)}`);
    if(!data.ok)throw new Error(data.error||"讀取失敗");
    renderHistory(data.records||[]);
    setStatus("同步完成"); showSyncMessage("同步完成","success");
  }catch(e){ setStatus("同步失敗"); showSyncMessage(e.message || "同步失敗，請稍後再試","error",true); }
}

function renderHistory(records){
  const historyList=document.getElementById("historyList");
  if(!records.length){historyList.innerHTML='<div class="empty">這組密碼目前沒有紀錄</div>';return;}
  historyList.innerHTML=records.map(r=>`
    <div class="history-item">
      <div class="history-head"><div class="history-name">${escapeHtml(r.name)}</div><div class="history-time">${formatDate(r.createdAt)}</div></div>
      <div class="history-grid">
        <div class="stat"><div class="stat-label">平均價格</div><div class="stat-value">${fmt(r.average,4)}</div></div>
        <div class="stat"><div class="stat-label">總數量</div><div class="stat-value">${fmt(r.totalQty,8)}</div></div>
      </div>
      <div class="actions">
        <button class="load" onclick='loadRecord(${JSON.stringify(JSON.stringify(r))})'>載入</button>
        <button class="remove" onclick='openDeleteModal(${JSON.stringify(r.id)})'>刪除</button>
      </div>
    </div>`).join("");
}

function loadRecord(s){
  const r=JSON.parse(s);
  document.getElementById("calcName").value=(r.name||"").toUpperCase();
  document.getElementById("currentPrice").value=r.currentPrice||"";
  document.getElementById("currentQty").value=r.currentQty||"";
  rows.innerHTML="";
  (r.buys||[]).forEach(b=>addRow(b.price,b.qty));
  if(!rows.children.length)addRow();
  calculate();
  scrollTo({top:0,behavior:"smooth"});
}

function openDeleteModal(id){
  pendingDeleteId = id;
  const modal = document.getElementById("confirmModal");
  if(modal) modal.classList.remove("hidden");
}

function closeDeleteModal(event){
  if(event && event.target && event.target.id !== "confirmModal") return;
  const modal = document.getElementById("confirmModal");
  if(modal) modal.classList.add("hidden");
  pendingDeleteId = null;
}

function confirmDelete(){
  if(!pendingDeleteId) return;
  document.getElementById("payloadField").value = JSON.stringify({
    action:"delete",
    syncCode:getSyncCode(),
    id:pendingDeleteId
  });
  document.getElementById("hiddenForm").submit();
  setStatus("正在刪除…");
  showSyncMessage("正在刪除紀錄…","info");
  closeDeleteModal();
  setTimeout(loadHistory,1200);
}

function clearInputs(){
  document.getElementById("calcName").value="";
  document.getElementById("currentPrice").value="";
  document.getElementById("currentQty").value="";
  rows.innerHTML="";
  addRow();
  calculate();
}

function formatDate(v){const d=new Date(v);return isNaN(d)?"":d.toLocaleString("zh-TW");}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

document.getElementById("passwordInput").addEventListener("keydown",e=>{if(e.key==="Enter")enterApp();});
document.addEventListener("keydown",e=>{
  if(e.key === "Escape") closeDeleteModal();
});
addRow();
calculate();

const savedSession = sessionStorage.getItem("avg_session_code");
if(savedSession){
  currentSyncCode = savedSession;
  document.getElementById("activeCode").textContent = "已連線";
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  loadHistory();
}
</script>
</body>
</html>
