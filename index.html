<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平均價格計算器</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}
    .screen{min-height:100vh;padding:22px 14px}
    .hidden{display:none!important}
    .container{max-width:650px;margin:auto}
    h1{text-align:center;font-size:26px}

    .login-screen{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
      background:#111827;
    }
    .login-card{
      width:100%;
      max-width:420px;
      background:white;
      border-radius:22px;
      padding:26px 22px;
      box-shadow:0 18px 50px rgba(0,0,0,.25);
    }
    .login-icon{
      width:64px;height:64px;border-radius:18px;
      background:#111827;color:white;
      display:flex;align-items:center;justify-content:center;
      font-size:30px;margin:0 auto 16px;
    }
    .login-title{text-align:center;font-size:24px;font-weight:750;margin-bottom:7px}
    .login-sub{text-align:center;color:#6b7280;font-size:14px;margin-bottom:22px}
    .password-wrap{position:relative}
    .password-wrap input{padding-right:52px}
    .toggle-pass{
      position:absolute;right:6px;top:50%;transform:translateY(-50%);
      background:transparent;color:#6b7280;padding:8px
    }
    .login-btn{
      width:100%;background:#2563eb;color:white;
      font-weight:700;margin-top:10px;padding:14px
    }
    .login-note{font-size:12px;color:#9ca3af;text-align:center;margin-top:12px;line-height:1.5}
    .login-error{color:#b91c1c;font-size:13px;margin-top:8px;min-height:18px}

    .card,.result-card{border-radius:18px;padding:18px;margin-bottom:16px}
    .card{background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.06)}
    .result-card{background:#111827;color:white;text-align:center}
    .result-title{color:#9ca3af;font-size:13px}
    .average{font-size:42px;font-weight:750;margin:8px 0 16px}
    .summary{display:grid;grid-template-columns:1fr;gap:10px}
    .summary-box{background:rgba(255,255,255,.08);padding:11px;border-radius:11px}
    .small{color:#9ca3af;font-size:12px}
    .value{font-weight:700;margin-top:4px}
    .title{font-size:18px;font-weight:700;margin-bottom:14px}
    label{display:block;font-size:12px;color:#6b7280;margin:0 0 6px}
    input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;outline:none}
    input:focus{border-color:#111827}
    .group{margin-bottom:13px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .buy-row{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;margin-bottom:9px}
    button{border:0;border-radius:10px;cursor:pointer;font-size:15px;padding:12px}
    .primary{width:100%;background:#111827;color:#fff;font-weight:650}
    .save{width:100%;background:#2563eb;color:white;font-weight:650;margin-top:9px}
    .secondary{width:100%;background:#e5e7eb;color:#374151;margin-top:9px}
    .logout{width:100%;background:#fee2e2;color:#b91c1c;margin-top:9px;font-weight:650}
    .delete{background:#fee2e2;color:#b91c1c;font-size:20px;padding:0}
    .status{margin-top:9px;font-size:13px;color:#6b7280}
    .history-item{border:1px solid #e5e7eb;border-radius:13px;padding:13px;margin-bottom:10px}
    .history-head{display:flex;justify-content:space-between;gap:8px}
    .history-name{font-size:17px;font-weight:700}
    .history-time{font-size:11px;color:#9ca3af}
    .history-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
    .stat{background:#f9fafb;border-radius:9px;padding:9px}
    .stat-label{color:#9ca3af;font-size:11px}
    .stat-value{font-size:13px;font-weight:700;margin-top:3px}
    .actions{display:flex;gap:7px;margin-top:9px}
    .actions button{flex:1;padding:9px}
    .load{background:#dbeafe;color:#1d4ed8}
    .remove{background:#fee2e2;color:#b91c1c}
    .empty{text-align:center;color:#9ca3af;padding:15px 0}
    .difference{margin-top:12px;background:#f3f4f6;color:#111827;padding:10px;border-radius:10px;font-size:13px}
    .active-code{font-size:13px;color:#6b7280;word-break:break-all}
    @media(max-width:500px){.history-grid{grid-template-columns:1fr}.average{font-size:38px}}
  </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <div class="login-title">輸入密碼</div>
    <div class="login-sub">輸入你的同步密碼後進入平均價格計算器</div>

    <div class="group">
      <label>密碼</label>
      <div class="password-wrap">
        <input id="passwordInput" type="password" placeholder="輸入密碼" autocomplete="current-password">
        <button type="button" class="toggle-pass" onclick="togglePassword()">顯示</button>
      </div>
      <div id="loginError" class="login-error"></div>
    </div>

    <button class="login-btn" onclick="enterApp()">進入</button>
    <div class="login-note">同一組密碼可在手機、平板、電腦使用同一份雲端紀錄。</div>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <div class="container">
    <h1>平均價格計算器</h1>

    <div class="card">
      <div class="title">目前同步帳號</div>
      <div class="active-code" id="activeCode">—</div>
      <div class="status" id="syncStatus">尚未同步</div>
      <button class="secondary" onclick="syncNow()">立即同步</button>
      <button class="logout" onclick="logout()">登出 / 更換密碼</button>
    </div>

    <div class="result-card">
      <div class="result-title">買入後平均價格</div>
      <div class="average" id="average">0.00</div>
      <div class="summary">
        <div class="summary-box"><div class="small">總數量</div><div class="value" id="totalQty">0.00</div></div>
      </div>
      <div class="difference" id="difference">輸入資料後自動計算</div>
    </div>

    <div class="card">
      <div class="title">計算資料</div>
      <div class="group"><label>名稱</label><input id="calcName" placeholder="例如 BTC、ETH、SOXL" inputmode="latin" autocapitalize="characters" autocomplete="off" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z]/g, '')"></div>
      <div class="grid">
        <div class="group"><label>目前平均價格</label><input id="currentPrice" type="number" step="any" oninput="calculate()"></div>
        <div class="group"><label>目前持有數量</label><input id="currentQty" type="number" step="any" oninput="calculate()"></div>
      </div>
      <div class="title" style="font-size:14px">新增買入</div>
      <div id="rows"></div>
      <button class="primary" onclick="addRow()">＋ 新增一筆買入</button>
      <button class="save" onclick="saveToCloud()">儲存到雲端</button>
      <button class="secondary" onclick="clearInputs()">清除目前輸入</button>
    </div>

    <div class="card">
      <div class="title">紀錄</div>
      <div id="historyList"><div class="empty">登入後會自動同步</div></div>
    </div>
  </div>
</div>

<iframe name="hiddenFrame" style="display:none"></iframe>
<form id="hiddenForm" action="https://script.google.com/macros/s/AKfycbxRr2tWrw3Y1QxquWXqwDHac6itRuu79o2B5LDCmA5JS7V225CV_Fiaj4kOxiAuj9jj/exec" method="POST" target="hiddenFrame" style="display:none">
  <input type="hidden" name="payload" id="payloadField">
</form>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxRr2tWrw3Y1QxquWXqwDHac6itRuu79o2B5LDCmA5JS7V225CV_Fiaj4kOxiAuj9jj/exec";
const rows = document.getElementById("rows");
let currentSyncCode = "";

function togglePassword(){
  const input = document.getElementById("passwordInput");
  const btn = document.querySelector(".toggle-pass");
  if(input.type === "password"){
    input.type = "text";
    btn.textContent = "隱藏";
  } else {
    input.type = "password";
    btn.textContent = "顯示";
  }
}

function enterApp(){
  const code = document.getElementById("passwordInput").value.trim();
  const error = document.getElementById("loginError");

  if(code.length < 4){
    error.textContent = "密碼至少輸入 4 個字元";
    return;
  }

  error.textContent = "";
  currentSyncCode = code;
  sessionStorage.setItem("avg_session_code", code);

  document.getElementById("activeCode").textContent = "已連線";
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");

  loadHistory();
}

function logout(){
  sessionStorage.removeItem("avg_session_code");
  currentSyncCode = "";
  document.getElementById("passwordInput").value = "";
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("historyList").innerHTML = '<div class="empty">登入後會自動同步</div>';
}

function addRow(price="", qty=""){
  const row=document.createElement("div");
  row.className="buy-row";
  row.innerHTML=`<input type="number" class="price" step="any" placeholder="買入價格" value="${price}" oninput="calculate()">
  <input type="number" class="qty" step="any" placeholder="數量" value="${qty}" oninput="calculate()">
  <button class="delete" onclick="removeRow(this)">×</button>`;
  rows.appendChild(row);
}

function removeRow(btn){btn.parentElement.remove();if(!rows.children.length)addRow();calculate();}

function getData(){
  const currentPrice=parseFloat(document.getElementById("currentPrice").value)||0;
  const currentQty=parseFloat(document.getElementById("currentQty").value)||0;
  let totalQty=currentQty,totalCost=currentPrice*currentQty;
  const buys=[];
  document.querySelectorAll(".buy-row").forEach(row=>{
    const p=parseFloat(row.querySelector(".price").value),q=parseFloat(row.querySelector(".qty").value);
    if(!isNaN(p)&&!isNaN(q)&&q>0){buys.push({price:p,qty:q});totalQty+=q;totalCost+=p*q;}
  });
  return {currentPrice,currentQty,buys,totalQty,totalCost,average:totalQty>0?totalCost/totalQty:0};
}

function fmt(n,d=4){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:d});}

function calculate(){
  const d=getData();
  document.getElementById("average").textContent=fmt(d.average,4);
  document.getElementById("totalQty").textContent=fmt(d.totalQty,8);
  const difference=document.getElementById("difference");
  if(d.currentPrice>0&&d.currentQty>0){
    const diff=d.average-d.currentPrice,pct=diff/d.currentPrice*100;
    difference.textContent=diff<0?`平均價降低 ${fmt(Math.abs(diff),4)}（${Math.abs(pct).toFixed(2)}%）`:diff>0?`平均價提高 ${fmt(diff,4)}（${pct.toFixed(2)}%）`:"平均價格沒有變化";
  }else difference.textContent="輸入目前持有資料後自動計算";
}

function getSyncCode(){return currentSyncCode;}
function setStatus(t){document.getElementById("syncStatus").textContent=t;}

function saveToCloud(){
  const syncCode=getSyncCode(),name=document.getElementById("calcName").value.trim().toUpperCase(),d=getData();
  if(!syncCode)return alert("請先登入");
  if(!name)return alert("請輸入名稱");
  if(d.totalQty<=0)return alert("請輸入價格與數量");

  document.getElementById("payloadField").value=JSON.stringify({action:"save",syncCode,name,...d});
  setStatus("正在儲存…");
  document.getElementById("hiddenForm").submit();

  setTimeout(()=>{
    setStatus("已送出，正在更新紀錄…");
    loadHistory();
  },1200);
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const s=document.createElement("script");
    let done=false;
    window[cb]=(data)=>{done=true;resolve(data);cleanup();};
    function cleanup(){delete window[cb];s.remove();}
    s.onerror=()=>{if(!done)reject(new Error("無法連線到雲端"));cleanup();};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+encodeURIComponent(cb);
    document.body.appendChild(s);
    setTimeout(()=>{if(!done){reject(new Error("同步逾時"));cleanup();}},10000);
  });
}

async function syncNow(){
  if(!getSyncCode())return alert("請先登入");
  await loadHistory();
}

async function loadHistory(){
  const syncCode=getSyncCode();
  if(!syncCode)return;
  setStatus("正在同步…");
  try{
    const data=await jsonp(`${API_URL}?action=list&syncCode=${encodeURIComponent(syncCode)}`);
    if(!data.ok)throw new Error(data.error||"讀取失敗");
    renderHistory(data.records||[]);
    setStatus("同步完成");
  }catch(e){setStatus("同步失敗");alert(e.message);}
}

function renderHistory(records){
  const historyList=document.getElementById("historyList");
  if(!records.length){historyList.innerHTML='<div class="empty">這組密碼目前沒有紀錄</div>';return;}
  historyList.innerHTML=records.map(r=>`
    <div class="history-item">
      <div class="history-head"><div class="history-name">${escapeHtml(r.name)}</div><div class="history-time">${formatDate(r.createdAt)}</div></div>
      <div class="history-grid">
        <div class="stat"><div class="stat-label">平均價格</div><div class="stat-value">${fmt(r.average,4)}</div></div>
        <div class="stat"><div class="stat-label">總數量</div><div class="stat-value">${fmt(r.totalQty,8)}</div></div>
      </div>
      <div class="actions">
        <button class="load" onclick='loadRecord(${JSON.stringify(JSON.stringify(r))})'>載入</button>
        <button class="remove" onclick='deleteRecord(${JSON.stringify(r.id)})'>刪除</button>
      </div>
    </div>`).join("");
}

function loadRecord(s){
  const r=JSON.parse(s);
  document.getElementById("calcName").value=(r.name||"").toUpperCase();
  document.getElementById("currentPrice").value=r.currentPrice||"";
  document.getElementById("currentQty").value=r.currentQty||"";
  rows.innerHTML="";
  (r.buys||[]).forEach(b=>addRow(b.price,b.qty));
  if(!rows.children.length)addRow();
  calculate();
  scrollTo({top:0,behavior:"smooth"});
}

function deleteRecord(id){
  if(!confirm("確定刪除這筆紀錄？"))return;
  document.getElementById("payloadField").value=JSON.stringify({action:"delete",syncCode:getSyncCode(),id});
  document.getElementById("hiddenForm").submit();
  setStatus("正在刪除…");
  setTimeout(loadHistory,1200);
}

function clearInputs(){
  document.getElementById("calcName").value="";
  document.getElementById("currentPrice").value="";
  document.getElementById("currentQty").value="";
  rows.innerHTML="";
  addRow();
  calculate();
}

function formatDate(v){const d=new Date(v);return isNaN(d)?"":d.toLocaleString("zh-TW");}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

document.getElementById("passwordInput").addEventListener("keydown",e=>{if(e.key==="Enter")enterApp();});
addRow();
calculate();

const savedSession = sessionStorage.getItem("avg_session_code");
if(savedSession){
  currentSyncCode = savedSession;
  document.getElementById("activeCode").textContent = "已連線";
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  loadHistory();
}
</script>
</body>
</html>
